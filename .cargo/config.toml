[env]
# The sqlx query macros check every statement against a schema at compile time.
# A fresh clone and CI have no database, so the verified metadata is committed
# in `.sqlx/` and read from there. `scripts/dev-database.sh` regenerates it.
# A shell that exports SQLX_OFFLINE overrides this, which is how that script
# forces a live check.
SQLX_OFFLINE = "true"
