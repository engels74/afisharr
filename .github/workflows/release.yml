#
# The release lane (D-035). Runs on every tagged release, budgeted at 6 hours.
#
# Everything the merge and nightly lanes run, plus the render-cache bound, the
# restore path, and the full matrix against every supported Plex version. Those
# suites arrive with the subsystems they cover; the jobs are wired now so a
# later phase adds a step to a lane that already exists.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The merge lane's nightly-status job asks for the nightly workflow's last
# result and for the pull request carrying a waiver, and a called workflow
# cannot widen what the caller grants — so both are granted here even though a
# release run is not a merge to main and returns before it reads a pull request.
permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

# The cargo jobs below set `working-directory: backend`. Cargo and rustup find
# `.cargo/config.toml` and `rust-toolchain.toml` by walking up from the working
# directory and never descend; both live in `backend/`. `plex-matrix` runs no
# cargo, so it stays at the checkout root.

jobs:
  merge-lane:
    name: merge-lane
    uses: ./.github/workflows/merge.yml

  nightly-lane:
    name: nightly-lane
    uses: ./.github/workflows/nightly.yml

  restore-path:
    name: restore-path
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          tools: nextest
      # I-SEC-5 and I-SEC-6: a restore without `secrets.key` loses credentials
      # and nothing else, and a backup is verified before it is called a backup.
      # Built in Phase 12.
      - name: restore suite
        run: |
          # Captured rather than piped: a pipeline's status is grep's, so a
          # tree that does not compile would read as "no such tests" and pass.
          listed=$(cargo nextest list --workspace --all-features -E 'test(restore)')
          if printf '%s' "$listed" | grep -q 'restore'; then
            cargo nextest run --workspace --all-features -E 'test(restore)'
          else
            echo "No restore tests exist yet (I-SEC-5 and I-SEC-6 are claimed in Phase 12)."
          fi

  plex-matrix:
    name: plex-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          tools: nextest
      # The contract test against a real server is what keeps the adversarial
      # fake honest: the fake makes failures reproducible, and this makes the
      # fake truthful (D-036). It needs a real Plex server, and it says so
      # rather than passing quietly when the lane has none — a contract test
      # that silently skips reads green on the one lane meant to catch drift.
      - name: contract tests against a real Plex server
        env:
          AFISHARR_PLEX_CONTRACT_URL: ${{ secrets.AFISHARR_PLEX_CONTRACT_URL }}
          AFISHARR_PLEX_CONTRACT_TOKEN: ${{ secrets.AFISHARR_PLEX_CONTRACT_TOKEN }}
        run: |
          if [ -z "${AFISHARR_PLEX_CONTRACT_URL:-}" ] || [ -z "${AFISHARR_PLEX_CONTRACT_TOKEN:-}" ]; then
            echo "::error title=plex-matrix::No real Plex server is configured for the" \
                 "release lane. Set the AFISHARR_PLEX_CONTRACT_URL and" \
                 "AFISHARR_PLEX_CONTRACT_TOKEN repository secrets; without them the" \
                 "adversarial fake (D-036) ships unverified."
            exit 1
          fi
          # `--no-capture`, so the per-call drift report reaches the log: a lane
          # that printed only "contract test failed" would send whoever reads it
          # back to a server they may not have.
          cargo nextest run --package afisharr-plex --all-features \
            --no-capture -E 'binary(contract)'

  render-cache-bound:
    name: render-cache-bound
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          tools: nextest
      # I-PERF-2: the render cache is bounded, default cap 10 GB, LRU eviction
      # by last_used_at. Built in Phase 8.
      - name: render-cache suite
        run: |
          # Captured rather than piped: a pipeline's status is grep's, so a
          # tree that does not compile would read as "no such tests" and pass.
          listed=$(cargo nextest list --workspace --all-features -E 'test(render_cache)')
          if printf '%s' "$listed" | grep -q 'render_cache'; then
            cargo nextest run --workspace --all-features -E 'test(render_cache)'
          else
            echo "No render-cache tests exist yet (I-PERF-2 is claimed in Phase 8)."
          fi
