# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The merge lane (D-035). Runs on every pull request and on pushes to main.
#
# Contains every table-driven and unit-level invariant — everything whose test
# is a pure function over enumerated inputs — and is budgeted at 10 minutes.
# The lanes are independent so a failure in one stack does not block
# investigating the other, and the fast ones (format, lint) fail loudly before
# the slow ones start.

name: ci

on:
  pull_request:
  push:
    branches: [main, feat/standardize-ci-renovate]
  merge_group:
  # The release lane runs this whole lane before it runs its own jobs.
  workflow_call:
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number for a repair dispatch
        type: string
        default: ''
      expected-head-sha:
        description: Exact repaired PR commit
        type: string
        default: ''

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

  pull-requests: read
env:
  CARGO_TERM_COLOR: always
  # The sqlx query macros read the committed offline data rather than a live
  # database; scripts/dev-database.sh regenerates it.
  SQLX_OFFLINE: "true"

# Every cargo step below carries `working-directory: backend`, set once per job
# under `defaults.run`. Cargo and rustup discover `.cargo/config.toml` and
# `rust-toolchain.toml` by walking up from the working directory and never
# descend, so a cargo step left at the checkout root gets the default toolchain
# and no `[env]` block, quietly. The exception is `rust-sqlx-prepare`, which
# calls a root script that does its own `cd`.

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: engels74/automation/actions/dispatch-guard@v1.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
  rust-fmt:
    name: rust-fmt
    needs:
      - guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo fmt --check

  rust-lint:
    name: rust-lint
    needs:
      - guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  rust-test:
    name: rust-test
    needs:
      - guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Turns the embedded-interface tests' "no SPA in this build" skip into a
      # failure. Without it a CI job that forgot to build the frontend would
      # report green while never exercising the one-file claim at all.
      AFISHARR_REQUIRE_SPA: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      # The SPA is embedded at compile time, so it has to exist before cargo
      # builds anything. This is what makes the embedded-interface tests assert
      # rather than skip.
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend
      - run: bun run --cwd frontend build
        working-directory: .
      - uses: ./.github/actions/rust
        with:
          tools: nextest
      - run: cargo nextest run --locked --workspace --all-features
      # nextest does not run doctests.
      - run: cargo test --locked --doc --workspace

  rust-sqlx-prepare:
    name: rust-sqlx-prepare
    needs:
      - guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          tools: sqlx
      # Every other rust lane reads `.sqlx/` and trusts it. Nothing in them
      # notices when a query changed and the committed metadata did not, because
      # stale metadata still compiles — it just describes a query that no longer
      # exists. This lane rebuilds the schema from the migrations and asks sqlx
      # whether what is committed is what the current queries produce.
      #
      # No `working-directory` here, unlike every other rust lane: the script
      # lives at the repository root and cd's into `backend/` itself.
      - run: ./scripts/dev-database.sh --check

  rust-supply-chain:
    name: rust-supply-chain
    needs:
      - guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          tools: deny machete
      # Licences, advisories, and bans. AGPL-3.0-or-later obliges every
      # dependency to be GPL-compatible and a transitive crate can introduce an
      # incompatible licence silently (PRD §21.9, D-028).
      - run: cargo deny --locked check
      - run: cargo machete

  rust-miri:
    name: rust-miri
    needs:
      - guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      # Every crate sets `unsafe_code = "forbid"` at the workspace root, so
      # there is nothing for Miri to find. The lane exists so the crate that
      # first takes a justified `unsafe` block is covered by a lane that already
      # runs, and this step fails the moment one appears.
        with:
          persist-credentials: false
      - name: assert no crate has taken an unsafe exception
        run: |
          # grep exits 1 for "no match" and 2 for "could not scan". Only the
          # first is an answer; treating both as one reports a scan that never
          # ran as a clean tree.
          status=0
          exceptions=$(grep -rn --include='*.rs' -E '^\s*#!\[allow\(unsafe_code' backend/crates) || status=$?
          case "$status" in
          0)
            printf '%s\n' "$exceptions" >&2
            echo "A crate has allowed unsafe_code. Extend this lane to run" >&2
            echo "cargo +nightly miri test against it (§A.5, §24.2.9)." >&2
            exit 1
            ;;
          1)
            echo "unsafe_code is forbidden workspace-wide; nothing to check."
            ;;
          *)
            echo "The unsafe_code scan could not run (grep exited $status)." >&2
            exit 1
            ;;
          esac

  structure:
    name: structure
    needs:
      - guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      # The script-checkable half of PRD §24.6 (D-047). Also a commit-stage prek
      # hook, so this is the backstop rather than the first line of defence.
        with:
          persist-credentials: false
      - run: ./scripts/check-file-size.sh

      - run: python3 scripts/test-nightly-status.py
  frontend-format-lint:
    name: frontend-format-lint
    needs:
      - guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend
      - run: bun run --cwd frontend lint

  frontend-interface-rules:
    name: frontend-interface-rules
    needs:
      - guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend
      # The two rules no general linter can see: no hard-coded user-facing
      # string (I-UX-7), and no display state inferred from an HTTP status or
      # an array length (I-UX-2).
      - run: bun run --cwd frontend lint:interface

  frontend-typecheck:
    name: frontend-typecheck
    needs:
      - guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend
      - run: bun run --cwd frontend check

  frontend-test-unit:
    name: frontend-test-unit
    needs:
      - guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend
      - run: bun test --cwd frontend

  frontend-test-browser:
    name: frontend-test-browser
    needs:
      - guard
      - frontend-typecheck
      - frontend-test-unit
    runs-on: ubuntu-24.04
    # The slowest frontend lane. A typecheck or unit failure is cheaper to
    # report first, so it waits on both.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend
      - run: bunx playwright install --with-deps chromium
        working-directory: frontend
      - run: bun run --cwd frontend test:browser

  frontend-build:
    name: frontend-build
    needs:
      - guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend
      # adapter-static. A page or component reaching for a server-only primitive
      # covered by §24.4 fails the build here.
      - run: bun run --cwd frontend build

  contract-check:
    name: contract-check
    needs:
      - guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      # Both toolchains: the document is printed by the compiled binary, and
      # the client is generated from it with bun.
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: ./.github/actions/frontend
      - run: ./scripts/check-openapi-contract.sh

  nightly-status:
    name: nightly-status
    needs:
      - guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
      # A nightly failure blocks the next merge to main until it is fixed or
      # explicitly waived with a named reason (D-035). Without this, the nightly
      # lane becomes a wall of red nobody reads.
        with:
          persist-credentials: false
      - name: refuse to merge past a red nightly
        env:
          GH_TOKEN: ${{ github.token }}
          # Which pull request carries the waiver, not the body itself: the
          # script reads the description live, so a waiver added after this
          # gate asked for one is visible to a re-run of the job.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPAIR_PR_NUMBER: ${{ inputs.pr-number }}
        run: ./scripts/check-nightly-status.sh

  hygiene:
    runs-on: ubuntu-24.04
    needs: guard
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: j178/prek-action@v3.0.0
        with:
          prek-version: 0.5.2
          extra-args: --all-files
        env:
          SKIP: no-commit-to-branch,cargo-fmt,cargo-clippy,cargo-deny,web-biome,interface-rules,file-size
      - run: git diff --exit-code HEAD
  required:
    name: ci / required
    needs:
      - guard
      - rust-fmt
      - rust-lint
      - rust-test
      - rust-sqlx-prepare
      - rust-supply-chain
      - rust-miri
      - structure
      - frontend-format-lint
      - frontend-interface-rules
      - frontend-typecheck
      - frontend-test-unit
      - frontend-test-browser
      - frontend-build
      - contract-check
      - nightly-status
      - hygiene
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: engels74/automation/actions/dispatch-guard@v1.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
      - uses: engels74/automation/actions/gate@v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          required: guard rust-fmt rust-lint rust-test rust-sqlx-prepare rust-supply-chain rust-miri structure frontend-format-lint frontend-interface-rules frontend-typecheck frontend-test-unit frontend-test-browser frontend-build contract-check nightly-status hygiene
