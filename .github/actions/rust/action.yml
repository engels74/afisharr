name: Rust toolchain
description: Pinned backend toolchain, cached builds, and versioned cargo tools.
inputs:
  tools:
    description: Space-separated cargo subcommands (nextest, deny, machete, sqlx).
    default: ''
runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      with:
        rust-src-dir: backend
        cache-workspaces: backend
    - name: Resolve requested tool versions
      id: tools
      shell: bash
      env:
        CARGO_TOOLS: ${{ inputs.tools }}
      run: |
        resolved=()
        for tool in $CARGO_TOOLS; do
          case "$tool" in
            nextest) resolved+=(cargo-nextest@0.9.143) ;;
            deny) resolved+=(cargo-deny@0.20.2) ;;
            machete) resolved+=(cargo-machete@0.9.2) ;;
            sqlx) resolved+=(sqlx-cli@0.9.0) ;;
            *) echo "Unsupported cargo tool: $tool" >&2; exit 1 ;;
          esac
        done
        (IFS=,; echo "tools=${resolved[*]}") >> "$GITHUB_OUTPUT"
    - uses: taiki-e/install-action@v2.87.8
      if: inputs.tools != ''
      with:
        tool: ${{ steps.tools.outputs.tools }}
