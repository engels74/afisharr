# cargo-deny — the machine check PRD §21.9 requires of D-028. Afisharr ships as
# AGPL-3.0-or-later, so every dependency must be GPL-compatible, and a
# transitive crate can introduce an incompatible licence without anyone noticing.

# The graph is the platforms PRD §21.5 ships, and no others. Left unscoped,
# cargo-deny resolves every target in the lockfile — Android, wasm, and the
# rest — and can refuse the tree over a crate that is never compiled into
# anything Afisharr publishes. That is a licence check reporting on software
# the project does not distribute, which is the one thing it must not do.
#
# `linux/armv7` is deliberately absent: §21.5 records it as unsupported.
[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"

[licenses]
# Afisharr's own crates are AGPL-3.0-or-later and are never published; the
# allow-list below is about what the dependency tree drags in.
private = { ignore = true }

# The allow-list is PRD §21.9's, not a description of today's tree. An entry
# nothing currently uses is the point: it stays allowed when something does.
unused-allowed-license = "allow"
# PRD §21.9 names the allow-list: MIT, Apache-2.0, BSD-2/3, ISC, Zlib, MPL-2.0,
# Unicode-3.0. Everything else is refused by default, including BSL, SSPL,
# Elastic, and CC-BY-NC. The PRD wins over the shorter illustrative list in the
# implementation plan's §A.2 (PRD §0.2).
allow = [
  "MIT",
  "Apache-2.0",
  # Apache-2.0 plus the LLVM exception, which only *removes* an obligation: it
  # waives the notice requirement for object-code distribution, and it is the
  # grant that makes Apache-2.0 code GPL-compatible in the first place. An
  # allow-list that takes Apache-2.0 and refuses Apache-2.0-with-more-permission
  # is refusing a superset of the rights it already accepted, which is the
  # licence check measuring the wrong thing.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
]
