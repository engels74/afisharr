[package]
name = "afisharr-sources"
description = "Afisharr external source adapters behind one instrumented outbound client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Workspace-internal: the shipped artefact is the binary, not these crates.
publish = false
repository.workspace = true
authors.workspace = true

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[lints]
workspace = true

[dev-dependencies]
# A socket, so the transport's failure modes can be provoked rather than
# described: a server that sends headers and then goes away is the one shape a
# mocked client cannot produce honestly.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
